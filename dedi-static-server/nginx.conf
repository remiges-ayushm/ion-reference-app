server {
    listen 80;

    root /usr/share/nginx/html;

    # DeDi discovery files (index.json, registry files, catalog files) are
    # fetched cross-origin by other network participants — allow it.
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
